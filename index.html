<style>
  :root{

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.7;
    -webkit-font-smoothing:antialiased;font-size:17px}
  h1,h2,h3{font-family:var(--serif);color:var(--forest);font-weight:500;line-height:1.15;letter-spacing:-.01em}
  a{color:inherit}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}
  .measure{max-width:var(--measure)}

  /* header */
  header{position:sticky;top:0;z-index:50;background:rgba(249,245,236,.92);
    backdrop-filter:saturate(1.1) blur(6px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:24px;height:70px}
  .brand{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--forest);
    letter-spacing:-.01em;white-space:nowrap;cursor:pointer;text-decoration:none}
  .brand small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--sage);margin-top:1px}
  nav.main{display:flex;gap:22px;margin-left:8px;flex:1}
  nav.main a{font-size:14.5px;font-weight:500;color:var(--ink-soft);text-decoration:none;
    padding:6px 0;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s}
  nav.main a:hover{color:var(--forest)}
  nav.main a.active{color:var(--forest);border-bottom-color:var(--gold)}
  .lang{display:flex;align-items:center;font-size:13px;font-weight:600;color:var(--ink-soft)}
  .lang button{background:none;border:none;font:inherit;color:var(--ink-soft);cursor:pointer;
    padding:2px 6px;border-radius:4px}
  .lang button.on{color:var(--forest);background:var(--sage-soft)}
  .lang span{opacity:.4;padding:0 1px}
  .btn{font-family:var(--sans);font-weight:600;font-size:14.5px;cursor:pointer;
    border:none;border-radius:2px;padding:11px 20px;text-decoration:none;display:inline-block;
    transition:transform .12s, background .15s}
  .btn:active{transform:translateY(1px)}
  .btn-forest{background:var(--forest);color:var(--cream)}
  .btn-forest:hover{background:var(--forest-deep)}
  .btn-gold{background:var(--gold);color:#2a2205}
  .btn-gold:hover{background:#a2830a}
  .btn-cream{background:var(--cream);color:var(--forest)}
  .btn-cream:hover{background:#fff}
  .cta-head{white-space:nowrap}
  .menu-toggle{display:none;background:none;border:none;font-size:24px;color:var(--forest);cursor:pointer}

  /* page fade */
  main{min-height:60vh}
  .page{display:none;animation:fade .4s ease}
  .page.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.page{animation:none}}

  section{padding:72px 0}
  .eyebrow{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em;
    color:var(--sage);margin-bottom:14px}
  h2.section{font-size:34px;margin-bottom:22px}
  p.lead{font-size:20px;line-height:1.65}
  .prose p{margin-bottom:20px;max-width:var(--measure)}
  .rule{height:1px;background:var(--line);border:0;max-width:var(--wrap);margin:0 auto}

  /* hero */
  .hero{position:relative;min-height:88vh;display:flex;align-items:center;justify-content:center;
    text-align:center;color:var(--cream);overflow:hidden;padding:40px 20px}
  .hero .ph{position:absolute;inset:0;background:
    radial-gradient(120% 120% at 70% 20%, #35694f 0%, #1B4332 55%, #12301F 100%)}
    .hero-inner{position:relative;max-width:760px}
  .hero h1{color:var(--cream);font-size:clamp(40px,7vw,74px);font-weight:500;line-height:1.05}
  .hero p{font-size:clamp(17px,2.4vw,21px);margin:26px auto 34px;max-width:600px;
    color:rgba(249,245,236,.9)}
  .hero .arrow{margin-left:6px}

  /* vision — signature moment */
  .vision{background:var(--forest);color:var(--cream);padding:96px 0}
  .vision .line{font-family:var(--serif);font-size:clamp(30px,5.2vw,56px);line-height:1.12;
    font-weight:400;max-width:15ch;margin-bottom:8px}
  .vision .line.a{color:rgba(249,245,236,.55)}
  .vision .line.b{color:var(--cream)}
  .vision .line.c{color:var(--cream)}
  .vision .line .gold{color:var(--gold)}

  /* mission / bands */
  .band-sage{background:var(--sage);color:var(--cream)}
  .band-sage h2{color:var(--cream)}
  .band-cream2{background:var(--cream-2)}

  /* media */
  .media{display:flex;align-items:center;gap:26px;flex-wrap:wrap;
    padding:30px 32px;background:#fff;border:1px solid var(--line);border-radius:4px;
    max-width:760px}
  .media .k{font-family:var(--serif);font-size:20px;color:var(--forest)}

  /* waitlist form */
  .form{max-width:520px}
  .form label{display:block;font-size:13px;font-weight:600;color:inherit;margin:16px 0 6px}
  .form input[type=text],.form input[type=email],.form textarea{width:100%;font:inherit;
    font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:3px;
    background:#fff;color:var(--ink)}
  .form textarea{min-height:120px;resize:vertical}
  .checks{margin-top:8px}
  .checks label{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px;
    margin:8px 0;cursor:pointer}
  .checks input{width:17px;height:17px;accent-color:var(--forest)}
  .form .btn{margin-top:24px}
  .form-note{font-size:13px;margin-top:14px;opacity:.7}
  .thanks{background:var(--gold-soft);border:1px solid var(--gold);color:#4a3c05;
    padding:16px 18px;border-radius:4px;font-weight:500;margin-top:20px;display:none}

  /* offer grid */
  .offer{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:36px}
  .offer .card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:30px 26px}
  .offer .card h3{font-size:21px;margin-bottom:12px;border-top:2px solid var(--gold);padding-top:18px;display:inline-block}
  .offer .card p{font-size:15.5px;color:var(--ink-soft)}

  /* land facts */
  .facts{display:flex;gap:40px;flex-wrap:wrap;margin-top:30px}
  .facts .f{border-left:2px solid var(--gold);padding-left:16px}
  .facts .f b{font-family:var(--serif);font-size:30px;color:var(--forest);display:block;font-weight:500}
  .facts .f span{font-size:14px;color:var(--ink-soft)}

  /* glimpse */
  .glimpse{background:var(--forest-deep);color:var(--cream);border-radius:6px;padding:52px 44px;margin-top:8px}
  .glimpse h2{color:var(--cream)}
  .glimpse p{color:rgba(249,245,236,.85);max-width:var(--measure)}

  /* faq */
  .faq-item{border-bottom:1px solid var(--line)}
  .faq-q{width:100%;text-align:left;background:none;border:none;font-family:var(--serif);
    font-size:21px;color:var(--forest);font-weight:500;cursor:pointer;padding:24px 40px 24px 0;
    position:relative}
  .faq-q::after{content:"+";position:absolute;right:6px;top:22px;font-family:var(--sans);
    font-size:24px;color:var(--sage);transition:transform .2s}
  .faq-item.open .faq-q::after{content:"–"}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .faq-a .inner{padding:0 0 26px;max-width:var(--measure);color:var(--ink)}
  .faq-a a{color:var(--sage);font-weight:500}
  .partners{margin-top:10px;font-size:15px}
  .partners a{display:inline-block;margin-right:18px}

  /* story */
  .story-hero{padding:80px 0 40px}
  .story-hero h1{font-size:clamp(38px,6vw,60px)}
  .signature{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--sage);margin-top:34px}

  /* contact */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
  .contact-grid a.email{font-family:var(--serif);font-size:22px;color:var(--sage);
    text-decoration:none;border-bottom:1px solid var(--line)}

  /* footer */
  footer{background:var(--forest-deep);color:rgba(249,245,236,.8);padding:56px 0 40px;margin-top:20px}
  footer .frow{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-end}
  footer .tag{font-family:var(--serif);font-size:22px;color:var(--cream);max-width:22ch;line-height:1.3}
  footer .meta{font-size:13px;line-height:1.9}
  footer a{color:var(--gold-soft);text-decoration:none}

  @media (max-width:820px){
    nav.main{display:none;position:absolute;top:70px;left:0;right:0;background:var(--cream);
      flex-direction:column;padding:14px 28px;border-bottom:1px solid var(--line);gap:4px}
    nav.main.open{display:flex}
    nav.main a{padding:10px 0;border-bottom:1px solid var(--line)}
    nav.main a.active{border-bottom-color:var(--line)}
    .menu-toggle{display:block;order:3}
    .cta-head{display:none}
    .bar{gap:12px}
    .offer{grid-template-columns:1fr}
    .contact-grid{grid-template-columns:1fr;gap:32px}
    section{padding:52px 0}
  }
</style>
</head>

          "Ce concept n’est pas nouveau. Au Moyen Âge, les communautés monastiques combinaient les lieux d’inhumation avec des vergers et des jardins, reflétant la compréhension que la vie et la mort font partie du même cycle naturel. Nous ravivons cette pratique pour le monde d’aujourd’hui — et pour les générations de demain."],
      p2h:"Pourquoi des arbres fruitiers ?",
      p2:["Les arbres fruitiers sont des symboles d’abondance et de continuité. Ils fournissent nourriture, abri pour les pollinisateurs, et beauté à chaque saison.",
          "De nombreuses variétés fruitières patrimoniales — cultivées depuis des siècles — disparaissent parce que l’agriculture industrielle ne les trouve plus rentables. Le Verger Cimetière de Pierrefonds plantera et préservera ces variétés menacées, un arbre à la fois, créant une bibliothèque vivante de biodiversité au cœur de notre communauté."],
      p3h:"Le terrain",
      p3:["Le projet est prévu pour la propriété de 5,7 hectares entourant l’ancien Jardin Cléroux (Botanix) sur le boulevard Gouin Ouest — un espace vert qui dessert la communauté de Pierrefonds et de l’Ouest-de-l’Île depuis plus de 60 ans."],
      facts:[["5,7 acres","d’espace vert vivant"],["+900","arbres possibles sur le site"],["60+ ans","au service de la communauté"]],
      offerH:"Ce que nous offrons",
      offer:[
        ["Terrains pour les personnes","Terrains d’enterrement naturel et écologique où un arbre fruitier patrimonial est planté à la place d’une pierre tombale. Les familles peuvent visiter le verger et voir l’arbre de leur proche grandir à chaque saison."],
        ["Terrains pour les animaux","Terrains d’enterrement naturel pour les animaux bien-aimés, chacun marqué par un arbre nain ou une plante vivace en fleurs."],
        ["Célébrations de vie","Les bâtiments existants sur la propriété seront aménagés avec soin en espaces pour les rassemblements commémoratifs, les célébrations de vie et les événements communautaires — entourés de nature."]
      ],
      glimpseH:"Un aperçu de ce qui vient",
      glimpse:["Le verger cimetière est l’âme de ce projet. Mais nous envisageons quelque chose de plus : une destination où les gens viennent non seulement pour pleurer, mais pour s’attarder, savourer et se connecter.",
        "Dans les saisons à venir, nous explorons la possibilité d’un espace boutique pour les visiteurs — un lieu pour se reposer, se retrouver et vivre la beauté du verger à chaque saison. Une cuisine où la récolte devient quelque chose de partagé. Un café où le deuil s’adoucit autour d’une tasse chaude, et où la vie — avec persistance — continue.",
        "Plus de détails arrivent. Restez proches."]
    },
    faq:{
      h:"Foire aux questions",
      items:[
        ["Qu’est-ce qu’un enterrement naturel ou écologique ?","Un enterrement simple et naturel, sans embaumement chimique, dans un cercueil en matériaux biodégradables — bois non fini, osier, carton ou un linceul naturel. Le corps retourne à la terre comme la nature l’a prévu."],
        ["Existe-t-il des sites similaires au Québec ?","Oui — il en existe actuellement deux. Le Verger Cimetière de Pierrefonds serait le troisième site d’enterrement naturel au Québec, et le premier à combiner l’enterrement écologique avec un vrai verger fruitier à cette échelle.<div class='partners'><a href='https://coopfuneraireestrie.com' target='_blank'>Coopérative Funéraire de l’Estrie →</a><a href='https://lessentiers.ca' target='_blank'>Les Sentiers →</a></div>"],
        ["Qu’advient-il des fruits cultivés dans le verger ?","Nous croyons en la continuité de la vie — et cela inclut la récolte. Les familles seront invitées à cueillir les fruits de l’arbre de leur proche, comme une tradition saisonnière. Les surplus pourront être compostés pour nourrir le verger, ou partagés avec des partenaires communautaires locaux. Nous façonnons encore les détails et accueillons vos idées."],
        ["Les familles peuvent-elles visiter les arbres ?","Oui. Le verger cimetière sera un espace accueillant et accessible pour que les familles et les proches puissent visiter, marcher et s’asseoir parmi les arbres à chaque saison. Ce n’est pas seulement un lieu de souvenir — c’est un lieu de retour."],
        ["Où en est le projet dans son développement ?","Nous avons présenté le projet à la Ville de Pierrefonds-Roxboro en 2023 et avons reçu un soutien encourageant. Nous avons été présentés sur CBC Radio, avons présenté la vision au propriétaire du terrain, et avons bâti une communauté grandissante de personnes qui croient en ce projet. Nous reconstruisons maintenant notre élan — en reprenant contact avec la ville, en explorant des structures de financement, et en faisant croître notre liste d’attente. Chaque nom sur cette liste est une voix qui dit : cela compte. Cela devrait exister. Si vous le croyez aussi, rejoignez-nous."],
        ["Comment puis-je aider ?","La chose la plus puissante que vous puissiez faire maintenant : rejoindre notre liste d’attente, partager ce projet avec quelqu’un qui le comprendrait, et — si vous travaillez en gouvernance municipale, finance environnementale, urbanisme ou dans l’industrie funéraire — nous contacter. Nous construisons des partenariats. Chaque conversation plante une graine."]
      ]
    },
    contact:{
      h:"Contact",
      p:"Vous avez des questions ? Vous souhaitez vous impliquer ? Ou vous voulez simplement dire bonjour ? Nous serions ravis de vous entendre.",
      email:"info@orchardcemetery.ca",
      fName:"Nom", fEmail:"Courriel", fMsg:"Message", btn:"Envoyer",
      thanks:"Merci — votre message est en route."
    },
    footer:{tag:"Là où la mémoire prend racine.", meta:"Orchard Cemetery · Verger Cimetière<br>Pierrefonds, Montréal<br>orchardcemetery.ca · vergercimetiere.ca"}
  }
};

let lang = "en";
let page = "home";

function esc(s){return s}
function paras(arr){return arr.map(p=>`<p>${p}</p>`).join("")}

function render(){
  const t = C[lang];
  document.documentElement.lang = lang;
  document.getElementById("brand-sub").textContent = t.brandSub;
  document.getElementById("cta-head").textContent = t.ctaHead;
  // nav
  document.getElementById("nav").innerHTML = Object.keys(t.nav).map(k=>
    `<a class="${page===k?'active':''}" onclick="go('${k}')">${t.nav[k]}</a>`).join("");
  // lang
  document.getElementById("lang").innerHTML =
    `<button class="${lang==='en'?'on':''}" onclick="setLang('en')">EN</button><span>|</span>`+
    `<button class="${lang==='fr'?'on':''}" onclick="setLang('fr')">FR</button>`;
  // footer
  document.getElementById("foot-tag").textContent = t.footer.tag;
  document.getElementById("foot-meta").innerHTML = t.footer.meta;
  // page
  document.getElementById("app").innerHTML = PAGES[page]();
  wireFaq();
}

const PAGES = {
  home(){const t=C[lang].home;return `
    <div class="page show">
      <div class="hero"><div class="ph"></div>
        <div class="hero-inner">
          <h1>${t.heroH}</h1>
          <p>${t.heroP}</p>
          <a class="btn btn-cream" onclick="scrollToForm()">${t.heroCta} <span class="arrow">→</span></a>
        </div>
      </div>

      <section><div class="wrap">
        <div class="eyebrow">${t.introEye}</div>
        <div class="prose"><p class="lead">${t.introP1}</p><p class="lead">${t.introP2}</p></div>
      </div></section>

      <div class="vision"><div class="wrap">
        <div class="line a">${t.v1}</div>
        <div class="line b">${t.v2}</div>
        <div class="line c">${t.v3}</div>
      </div></div>

      <section><div class="wrap">
        <div class="eyebrow">${t.missionEye}</div>
        <h2 class="section">${C[lang].nav.home==='Home'?'A place where grief and growth coexist':'Un lieu où le deuil et la croissance coexistent'}</h2>
        <div class="prose"><p>${t.missionP1}</p><p>${t.missionP2}</p></div>
      </div></section>

      <section class="band-sage" id="waitlist"><div class="wrap">
        <div style="max-width:560px">
          <h2 class="section">${t.wlH}</h2>
          <p class="lead" style="margin-bottom:8px">${t.wlP}</p>
          <div class="form">
            <label>${t.fName}</label><input type="text" id="wl-name">
            <label>${t.fEmail}</label><input type="email" id="wl-email">
            <label>${t.fInterest}</label>
            <div class="checks">
              <label><input type="checkbox">${t.opt1}</label>
              <label><input type="checkbox">${t.opt2}</label>
              <label><input type="checkbox">${t.opt3}</label>
              <label><input type="checkbox">${t.opt4}</label>
            </div>
            <button class="btn btn-cream" onclick="fakeSubmit('wl-thanks')">${t.wlBtn} →</button>
            <div class="thanks" id="wl-thanks">${t.thanks}</div>
          </div>
        </div>
      </div></section>
    </div>`;
  },

  story(){const t=C[lang].story;return `
    <div class="page show">
      <div class="story-hero"><div class="wrap">
        <div class="eyebrow">${t.note}</div>
        <h1>${t.h}</h1>
      </div></div>
      <hr class="rule">
      <section><div class="wrap prose">
        <h2 class="section">${t.s1h}</h2>${paras(t.s1)}
      </div></section>
      <section class="band-cream2"><div class="wrap prose">
        <h2 class="section">${t.s2h}</h2>${paras(t.s2)}
      </div></section>
      <section><div class="wrap prose">
        <h2 class="section">${t.s3h}</h2>${paras(t.s3)}
        <div class="signature">${t.sign}</div>
      </div></section>
    </div>`;
  },

  project(){const t=C[lang].project;return `
    <div class="page show">
      <div class="story-hero"><div class="wrap"><h1>${t.h}</h1></div></div>
      <hr class="rule">
      <section><div class="wrap prose">
        <h2 class="section">${t.p1h}</h2>${paras(t.p1)}
      </div></section>
      <section class="band-cream2"><div class="wrap prose">
        <h2 class="section">${t.p2h}</h2>${paras(t.p2)}
      </div></section>
      <section><div class="wrap">
        <div class="prose"><h2 class="section">${t.p3h}</h2>${paras(t.p3)}</div>
        <div class="facts">
          ${t.facts.map(f=>`<div class="f"><b>${f[0]}</b><span>${f[1]}</span></div>`).join("")}
        </div>
      </div></section>
      <section class="band-sage"><div class="wrap">
        <h2 class="section">${t.offerH}</h2>
        <div class="offer">
          ${t.offer.map(o=>`<div class="card"><h3>${o[0]}</h3><p>${o[1]}</p></div>`).join("")}
        </div>
      </div></section>
      <section><div class="wrap">
        <div class="glimpse"><h2 class="section">${t.glimpseH}</h2>${paras(t.glimpse)}</div>
      </div></section>
    </div>`;
  },

  faq(){const t=C[lang].faq;return `
    <div class="page show">
      <div class="story-hero"><div class="wrap"><h1>${t.h}</h1></div></div>
      <hr class="rule">
      <section><div class="wrap" style="max-width:820px">
        ${t.items.map(it=>`
          <div class="faq-item">
            <button class="faq-q" onclick="toggleFaq(this)">${it[0]}</button>
            <div class="faq-a"><div class="inner">${it[1]}</div></div>
          </div>`).join("")}
      </div></section>
    </div>`;
  },

  contact(){const t=C[lang].contact;return `
    <div class="page show">
      <div class="story-hero"><div class="wrap"><h1>${t.h}</h1></div></div>
      <hr class="rule">
      <section><div class="wrap">
        <div class="contact-grid">
          <div class="prose">
            <p class="lead">${t.p}</p>
            <a class="email" href="mailto:${t.email}">${t.email}</a>
          </div>
          <div class="form">
            <label>${t.fName}</label><input type="text">
            <label>${t.fEmail}</label><input type="email">
            <label>${t.fMsg}</label><textarea></textarea>
            <button class="btn btn-forest" onclick="fakeSubmit('ct-thanks')">${t.btn} →</button>
            <div class="thanks" id="ct-thanks">${t.thanks}</div>
          </div>
        </div>
      </div></section>
    </div>`;
  }
};

function go(p){page=p;document.getElementById('nav').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});}
function setLang(l){lang=l;render();}
function scrollToForm(){const w=document.getElementById('waitlist');if(w){w.scrollIntoView({behavior:'smooth'});}}
function fakeSubmit(id){const el=document.getElementById(id);if(el)el.style.display='block';}
function toggleFaq(btn){const item=btn.parentElement;const a=item.querySelector('.faq-a');
  const open=item.classList.toggle('open');a.style.maxHeight=open?a.querySelector('.inner').scrollHeight+40+'px':'0';}
function wireFaq(){}

render();
</script>
</body>
